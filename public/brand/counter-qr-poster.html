<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>THE CAFFEINE PLUG — Counter Loyalty Standee</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background-color: #0a0a0a;
        color: #ffffff;
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px 16px;
      }
      .standee-card {
        width: 100%;
        max-width: 440px;
        background: #121214;
        border: 2px solid #27272a;
        border-radius: 24px;
        padding: 36px 28px;
        text-align: center;
        box-shadow: 0 25px 60px rgba(0, 0, 0, 0.9);
        position: relative;
        overflow: hidden;
      }
      .corner-tick {
        position: absolute;
        top: 14px;
        right: -32px;
        background: #ffffff;
        color: #0a0a0a;
        font-family: monospace;
        font-weight: 900;
        font-size: 9px;
        letter-spacing: 2px;
        padding: 4px 32px;
        transform: rotate(45deg);
        text-transform: uppercase;
      }
      .eyebrow {
        font-family: monospace;
        font-size: 11px;
        letter-spacing: 3px;
        color: #a1a1aa;
        text-transform: uppercase;
        margin-bottom: 8px;
        display: inline-block;
      }
      h1.brand-name {
        font-size: 28px;
        font-weight: 900;
        letter-spacing: 2px;
        text-transform: uppercase;
        margin-bottom: 6px;
        color: #ffffff;
      }
      p.tagline {
        font-size: 11px;
        letter-spacing: 2px;
        color: #a1a1aa;
        text-transform: uppercase;
        margin-bottom: 24px;
        font-weight: 600;
      }
      .cta-banner {
        background: #ffffff;
        color: #0a0a0a;
        border-radius: 12px;
        padding: 12px 16px;
        font-weight: 900;
        font-size: 14px;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        margin-bottom: 24px;
        box-shadow: 0 0 25px rgba(255, 255, 255, 0.15);
      }
      .qr-container {
        background: #ffffff;
        border-radius: 20px;
        padding: 16px;
        display: inline-block;
        margin-bottom: 16px;
        border: 3px solid #27272a;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      }
      .qr-container svg {
        display: block;
        width: 280px;
        height: 280px;
        margin: 0 auto;
      }
      .qr-url {
        font-family: monospace;
        font-size: 11px;
        letter-spacing: 1px;
        color: #a1a1aa;
        margin-bottom: 22px;
        word-break: break-all;
      }
      .value-props {
        background: #1c1c1f;
        border: 1px solid #27272a;
        border-radius: 14px;
        padding: 14px;
        font-family: monospace;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 1px;
        color: #ffffff;
        text-transform: uppercase;
        margin-bottom: 24px;
        line-height: 1.6;
      }
      .footer-social {
        font-family: monospace;
        font-size: 11px;
        letter-spacing: 2px;
        color: #a1a1aa;
        text-transform: uppercase;
        border-top: 1px solid #27272a;
        padding-top: 18px;
      }
      .footer-social .handle {
        color: #ffffff;
        font-weight: 700;
      }
      @media print {
        body {
          background: #ffffff !important;
          color: #0a0a0a !important;
          padding: 0;
        }
        .standee-card {
          border: 2px solid #0a0a0a;
          background: #ffffff;
          box-shadow: none;
          max-width: 100%;
          border-radius: 0;
        }
        .corner-tick {
          background: #0a0a0a;
          color: #ffffff;
        }
        h1.brand-name {
          color: #0a0a0a;
        }
        .eyebrow,
        p.tagline,
        .qr-url,
        .footer-social {
          color: #555555;
        }
        .cta-banner {
          background: #0a0a0a;
          color: #ffffff;
        }
        .qr-container {
          border-color: #0a0a0a;
        }
        .value-props {
          background: #f4f4f5;
          border-color: #0a0a0a;
          color: #0a0a0a;
        }
        .footer-social .handle {
          color: #0a0a0a;
        }
      }
    </style>
  </head>
